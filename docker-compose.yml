name: syncboard

services:
  # ==========================================
  # MongoDB — persistent data store
  # ==========================================
  mongo:
    image: mongo:7.0
    container_name: syncboard-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-syncboard}
    ports:
      - "127.0.0.1:27017:27017"   # Localhost only — not exposed publicly
    volumes:
      - mongo_data:/data/db
    networks:
      - syncboard-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\").ok' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # Redis — Socket.io adapter (pub/sub) + presence (TTL keys)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: syncboard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"     # Localhost only
    volumes:
      - redis_data:/data
    networks:
      - syncboard-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ==========================================
  # API Server — Express + Socket.io
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: syncboard-server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-password123}@mongo:27017/${MONGO_DB:-syncboard}?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-prod}
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    networks:
      - syncboard-network
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================================
  # React Client — Vite dev server
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: syncboard-client
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    networks:
      - syncboard-network
    depends_on:
      - server

# ==========================================
# Volumes & Networks
# ==========================================
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
  server_node_modules:   # Isolates container node_modules from host
  client_node_modules:

networks:
  syncboard-network:
    driver: bridge
