name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'server/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./server
      run: npm ci
      
    - name: Run Backend Tests
      working-directory: ./server
      run: npm run test

  build-client:
    name: Client Build & Type Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'client/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./client
      run: npm ci
      
    - name: Type Check
      working-directory: ./client
      run: npx tsc --noEmit
      
    - name: Build
      working-directory: ./client
      run: npm run build
